<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styless/styless.css">
    <title>Practica del modulo 9</title>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header__menu">
            <img class="header__icon" src="img/Gymshark-menu.png" alt="Icono Menu">
        </div>
        <img class="header__logo" src="img/gymshark-logo.png" alt="Logo GYMSHARK">
        <div class="header__cart">
            <img class="header__icon header__icon-carrito" src="img/svgviewer-output.svg" alt="Icono Carrito">
        </div>
    </header>
    <main>
        <!-- BANNER -->
        <section class="banner">
            <h2 class="banner__titulo">Productos Nuevos</h2>
            <p class="banner__descripcion">Conoce nuestros productos nuevos</p>
        </section>
        <!-- PRODUCTOS -->
        <section class="products">
            <article class="products__item">
                <img class="products__image" src="img/oversize.png" alt="">
                <h3 class="products__title">Oversize</h3>
                <p class="products__price">$50 USD</p>
            </article>
            <article class="products__item">
                <img class="products__image" src="img/camisa-compresion.jpg" alt="">
                <h3 class="products__title">Camisa de compresion</h3>
                <p class="products__price">$40 USD</p>
            </article>
            <article class="products__item">
                <img class="products__image" src="img/short.jpg" alt="">
                <h3 class="products__title">Short</h3>
                <p class="products__price">$30 USD</p>
            </article>
            <article class="products__item">
                <img class="products__image" src="img/oversize.png" alt="">
                <h3 class="products__title">Oversize</h3>
                <p class="products__price">$50 USD</p>
            </article>
            <article class="products__item">
                <img class="products__image" src="img/camisa-compresion.jpg" alt="">
                <h3 class="products__title">Camisa de compresion</h3>
                <p class="products__price">$40 USD</p>
            </article>
            <article class="products__item">
                <img class="products__image" src="img/short.jpg" alt="">
                <h3 class="products__title">Short</h3>
                <p class="products__price">$30 USD</p>
            </article>
            <article class="products__item">
                <img class="products__image" src="img/oversize.png" alt="">
                <h3 class="products__title">Oversize</h3>
                <p class="products__price">$50 USD</p>
            </article>
            <article class="products__item">
                <img class="products__image" src="img/camisa-compresion.jpg" alt="">
                <h3 class="products__title">Camisa de compresion</h3>
                <p class="products__price">$40 USD</p>
            </article class="products__item">
            <article class="products__item">
                <img class="products__image" src="img/short.jpg" alt="">
                <h3 class="products__title">Short</h3>
                <p class="products__price">$30 USD</p>
            </article>
        </section>
        <!-- CARRITO DE COMPRAS -->
        <section class="cart">
            <header class="cart__header">
                <h2 class="cart__title">Carrito de Compras</h2>
            </header>
            <article class="cart__item">
                <img class="cart__item-image" src="img/oversize.png" alt="Oversize">
                <p class="cart__item-name">Oversize</p>
                <p class="cart__item-price">$ 50</p>
                <i class="cart__item-remove">
                    <img class="cart__item-remove-icon" src="img/svgviewer-output (1).svg" alt="Eliminar">
                </i>
            </article>
        </section>
    </main>
</body>
</html>
