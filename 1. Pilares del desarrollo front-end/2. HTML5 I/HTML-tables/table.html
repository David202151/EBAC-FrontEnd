<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla en HTML</title>
</head>
<body>
    <table border="1" cellpadding="5">
        <caption>PAISES</caption>
        <thead bgcolor="#D3D3D3">
            <tr>
                <th>Paises</th>
                <th>Poblacion</th>
                <th>Idioma</th>
            </tr>
        </thead>
        <tbody align="center">
            <tr>
                <td>Mexico</td>
                <td>2,000,000</td>
                <td>Español</td>
            </tr>
            <tr>
                <td>España</td>
                <td>10,000,000</td>
                <td>Español</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
